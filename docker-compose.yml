services:
  calculator:
    build: .
    image: kaushalrajpuwar/arithmos-calculator:latest
    container_name: arithmos-calculator
    ports:
      - "8081:8080"
    environment:
      - APP_PORT=8080
    networks:
      - arithmos-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    image: nginx:1.27-alpine
    container_name: arithmos-proxy
    depends_on:
      calculator:
        condition: service_healthy
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - arithmos-net
    restart: unless-stopped

networks:
  arithmos-net:
    driver: bridge
